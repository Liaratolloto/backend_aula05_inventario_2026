<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>

<body>
    <header>
        <h1>Inventário</h1>
    </header>
    <main>
        <section>
            <form action="http://localhost:3000" method="post">
                <input type="text" name="item" placeholder="Nome do item" required>
                <input type="text" name="local" placeholder="local" required>
                <input type="date" name="dataregistro" required>
                <input type="number" step="item" placeholder="Valor do item" required>
                <input type="text" name="patrimonio" placeholder="Numero de patrimonio" required>
                <input type="button" value="Enviar" </form>
        </section>
        <section>
            <table>
                <thead>
                    <th>Item</th>
                    <th>Local</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Patrimônio</th>
                </thead>
                <tbody id="tabela">
                    <script>
                        fetch('http://localhost:3000/bens')
                            .then(resp => resp.json())
                            .then(resp => {

                                resp.forEach(p => {
                                    const linha = document.createElement('tr')
                                    linha.innerHTML = `
                                    <td>${p.item}</td>
                                    <td>${p.local}</td>
                                    <td>${p.dataRegistro}</td>
                                    <td>${p.valor}</td>
                                    <td>${p.patrimonio}</td>`

                                    tabela.appendChild(linha)
                                })

                            })
                    </script>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <h2>by Liara</h2>
    </footer>
</body>

</html>
